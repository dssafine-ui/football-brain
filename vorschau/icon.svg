<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Football Brain</title>
  <defs>
    <linearGradient id="ik-grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bf5"/>
      <stop offset="1" stop-color="#153f9e"/>
    </linearGradient>
    <clipPath id="ik-form">
      <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z"/>
    </clipPath>
  </defs>

  <!-- Flacher Hintergrund, bis an den Rand (für runde und abgerundete Masken). Alles Wichtige liegt in der Mitte. -->
  <rect width="512" height="512" fill="url(#ik-grund)"/>

  <!-- Ein einzelner, ruhiger Football: flache Farbe, wenige Linien, gut lesbar auch klein. -->
  <g transform="translate(256 256) rotate(-30) scale(0.95)">
    <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z" fill="#c9611f"/>
    <g clip-path="url(#ik-form)" fill="none" stroke="#ffffff" stroke-width="14">
      <path d="M-132 -125Q-164 0 -132 125"/>
      <path d="M132 -125Q164 0 132 125"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round">
      <path d="M-62 0H62M-40 -24V24M0 -26V26M40 -24V24"/>
    </g>
    <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z" fill="none" stroke="#4a1d08" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
