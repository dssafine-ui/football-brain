<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Football Brain</title>
  <defs>
    <radialGradient id="ik-grund" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#4a94ff"/>
      <stop offset="0.5" stop-color="#1b62e0"/>
      <stop offset="1" stop-color="#0b3585"/>
    </radialGradient>
    <linearGradient id="ik-scheibe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3e4ff"/>
    </linearGradient>
    <clipPath id="ik-innen">
      <circle cx="256" cy="256" r="148"/>
    </clipPath>
    <radialGradient id="ik-leder" gradientUnits="userSpaceOnUse" cx="-55" cy="-50" r="270">
      <stop offset="0" stop-color="#f0a05a"/>
      <stop offset="0.38" stop-color="#cc6a2a"/>
      <stop offset="0.75" stop-color="#9a4417"/>
      <stop offset="1" stop-color="#6a280c"/>
    </radialGradient>
    <linearGradient id="ik-schatten" gradientUnits="userSpaceOnUse" x1="0" y1="-30" x2="0" y2="112">
      <stop offset="0" stop-color="#2a0d03" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a0d03" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ik-glanz" gradientUnits="userSpaceOnUse" x1="-130" y1="0" x2="20" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ik-form">
      <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z"/>
    </clipPath>
    <path id="ik-stern" fill="#ffd84d" d="M0 -1Q0.12 -0.12 1 0Q0.12 0.12 0 1Q-0.12 0.12 -1 0Q-0.12 -0.12 0 -1Z"/>
  </defs>

  <!-- Hintergrund: Blau mit hellen Strahlen. Alles Wichtige liegt in der inneren Kreiszone, damit runde Symbole nichts abschneiden. -->
  <rect width="512" height="512" fill="url(#ik-grund)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="400" stroke-dasharray="52.36 52.36" transform="rotate(7.5 256 256)"/>

  <!-- Weiße Scheibe mit rotem Ring, darunter der Schatten des Balls -->
  <circle cx="256" cy="256" r="156" fill="url(#ik-scheibe)" stroke="#e5243b" stroke-width="16"/>
  <ellipse cx="268" cy="376" rx="118" ry="14" fill="#0b2d73" fill-opacity="0.2" clip-path="url(#ik-innen)"/>

  <!-- Der Football, leicht gekippt, Spitzen ragen über den Ring hinaus -->
  <g transform="translate(256 252) rotate(-24) scale(0.92)">
    <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z" fill="url(#ik-leder)"/>
    <g clip-path="url(#ik-form)" fill="none">
      <g stroke="#fffaf0" stroke-width="12">
        <path d="M-136 -125Q-168 0 -136 125"/>
        <path d="M-110 -125Q-142 0 -110 125"/>
        <path d="M136 -125Q168 0 136 125"/>
        <path d="M110 -125Q142 0 110 125"/>
      </g>
      <path d="M-200 0H-64M64 0H200" stroke="#3a1608" stroke-opacity="0.5" stroke-width="3.5"/>
    </g>
    <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z" fill="url(#ik-schatten)"/>
    <g fill="none" stroke-linecap="round" stroke-width="9">
      <path d="M-62 4H62M-48 -18V26M-24 -21V29M0 -22V30M24 -21V29M48 -18V26" stroke="#2a0f04" stroke-opacity="0.45"/>
      <path d="M-62 0H62M-48 -22V22M-24 -25V25M0 -26V26M24 -25V25M48 -22V22" stroke="#fffaf0"/>
    </g>
    <path d="M-124 -53C-98 -74 -56 -86 -8 -88" fill="none" stroke="url(#ik-glanz)" stroke-width="11" stroke-linecap="round"/>
    <path d="M-200 0C-150 -70 -70 -112.5 0 -112.5C70 -112.5 150 -70 200 0C150 70 70 112.5 0 112.5C-70 112.5 -150 70 -200 0Z" fill="none" stroke="#3a1608" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <!-- Funkeln -->
  <use href="#ik-stern" transform="translate(112 122) scale(34)"/>
  <use href="#ik-stern" transform="translate(402 398) scale(24)"/>
  <use href="#ik-stern" transform="translate(398 112) scale(14)"/>
</svg>
